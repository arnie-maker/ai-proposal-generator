<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05030f" />
<title>Moon Racer — Arcade Lunar Circuit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; width:100%; background:#05030f; color:#e2e8f0; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  #app { position:absolute; inset:0; width:100%; height:100%; min-height:320px; touch-action:none; }
  #app canvas { display:block; touch-action:none; }
  .vignette { pointer-events:none; position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 58%, rgba(5,3,15,0.5) 100%); }
  .gradient-text { background:linear-gradient(135deg,#4f6ef7,#8b5cf6); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .glass { background:rgba(255,255,255,0.03); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); border-radius:16px; }
  .btn-gradient { background:linear-gradient(135deg,#4f6ef7,#8b5cf6); color:#fff; border:none; border-radius:12px; padding:12px 26px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .12s ease; }
  .btn-gradient:active { transform:translateY(1px); }

  .speedblur { position:absolute; inset:0; pointer-events:none; opacity:0; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    -webkit-mask-image:radial-gradient(ellipse 58% 48% at 50% 46%, transparent 50%, #000 90%); mask-image:radial-gradient(ellipse 58% 48% at 50% 46%, transparent 50%, #000 90%); transition:opacity .1s linear; }
  .boost-flash { position:absolute; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at 50% 120%, rgba(0,229,255,0.2), transparent 60%); transition:opacity .18s ease; }
  .hurt-flash { position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 120px rgba(255,40,70,0.6); transition:opacity .3s ease; }

  .hud { pointer-events:none; position:absolute; inset:0; }
  .tl { position:absolute; top:calc(env(safe-area-inset-top) + 12px); left:14px; padding:8px 12px; }
  .tr { position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:14px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .label { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:#64748b; }
  .score { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; }
  .chip { pointer-events:auto; padding:7px 11px; font-size:12px; font-weight:700; color:#e2e8f0; cursor:pointer; border-radius:12px; }
  .panel { padding:8px 12px; }
  .lap { font-weight:800; font-size:13px; }

  .minimap { position:absolute; right:14px; bottom:calc(env(safe-area-inset-bottom) + 108px); width:116px; height:116px; border-radius:14px; overflow:hidden; }
  .minimap canvas { width:100%; height:100%; display:block; }

  /* speed + nitro cluster */
  .gauge { position:absolute; left:14px; bottom:calc(env(safe-area-inset-bottom) + 18px); padding:8px 12px; min-width:118px; }
  .gauge .v { font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
  .gauge .u { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#7c8bb0; }
  .bar { height:6px; border-radius:999px; background:rgba(255,255,255,0.1); overflow:hidden; margin-top:6px; }
  .spfill { height:100%; width:0%; background:linear-gradient(90deg,#00e5ff,#8b5cf6,#ff2bd6); transition:width .08s linear; }
  .nlabel { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8affff; margin-top:6px; }
  .nfill { height:100%; width:0%; background:linear-gradient(90deg,#00e5ff,#a0f6ff); }
  .nfull .nfill { animation:nglow .5s ease-in-out infinite alternate; }
  @keyframes nglow { to { box-shadow:0 0 12px rgba(0,229,255,0.9); } }

  .actions { pointer-events:none; position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); display:flex; align-items:flex-end; gap:12px; }
  .act-btn { pointer-events:auto; touch-action:none; width:82px; height:82px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; font-weight:800; letter-spacing:.04em; font-size:11px; border:3px solid; transition:transform .1s ease; position:relative; }
  .act-btn .rk { font-size:24px; }
  .act-btn:active, .act-btn.active { transform:scale(0.92); }
  .nitro-btn { color:#8affff; border-color:rgba(80,240,255,0.8); background:radial-gradient(circle at 50% 35%, rgba(60,220,255,0.36), rgba(4,16,20,0.85)); box-shadow:0 0 26px rgba(60,220,255,0.35); }
  .nitro-btn.active { box-shadow:0 0 46px rgba(60,220,255,0.8); }
  .nitro-btn:disabled, .nitro-btn.empty { opacity:0.4; }
  .drift-btn { color:#ffd18a; border-color:rgba(255,170,60,0.8); background:radial-gradient(circle at 50% 35%, rgba(255,150,50,0.34), rgba(20,10,4,0.85)); box-shadow:0 0 24px rgba(255,150,40,0.3); }
  .fire-btn { color:#ff9db0; border-color:rgba(255,70,110,0.8); background:radial-gradient(circle at 50% 35%, rgba(255,50,90,0.34), rgba(18,4,8,0.85)); box-shadow:0 0 24px rgba(255,60,90,0.32); }
  .fire-btn.active { box-shadow:0 0 42px rgba(255,60,90,0.75); }
  .drift-btn.active { box-shadow:0 0 42px rgba(255,150,40,0.75); }

  .wheel { pointer-events:auto; touch-action:none; position:absolute; left:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); width:128px; height:128px; border-radius:50%; border:2px dashed rgba(0,229,255,0.28); background:radial-gradient(circle at 50% 50%, rgba(0,229,255,0.05), rgba(6,8,20,0.35)); display:flex; align-items:center; justify-content:center; }
  .wheel .knob { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle,#00e5ff,#4f6ef7); box-shadow:0 0 22px rgba(0,229,255,0.6); transition:transform .04s linear; }
  .wheel .wl { position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#7c8bb0; white-space:nowrap; }
  @media (hover:hover) and (pointer:fine) and (min-width:900px) { .actions, .wheel { display:none; } }

  .popups { pointer-events:none; position:absolute; inset:0; overflow:hidden; }
  .pop { position:absolute; transform:translate(-50%,-50%); font-weight:900; white-space:nowrap; animation:popUp 1s ease-out forwards; text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  @keyframes popUp { 0%{opacity:0; transform:translate(-50%,-50%) scale(.6);} 15%{opacity:1; transform:translate(-50%,-64%) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-150%) scale(1);} }
  .toasts { pointer-events:none; position:absolute; left:50%; top:16%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .toast { font-weight:800; padding:8px 16px; border-radius:12px; animation:toastIn .4s ease, toastOut .4s ease 1.4s forwards; box-shadow:0 6px 24px rgba(0,0,0,0.4); }
  @keyframes toastIn { from{opacity:0; transform:translateY(12px) scale(.9);} to{opacity:1;} }
  @keyframes toastOut { to{opacity:0; transform:translateY(-12px);} }

  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; overflow:auto; }
  .overlay.hidden { display:none; }
  .card { padding:26px 24px; max-width:420px; width:100%; }
  .card h1 { margin:0 0 6px; font-size:32px; font-weight:900; letter-spacing:.02em; text-wrap:balance; }
  .card p.lead { margin:0 0 16px; font-size:13.5px; color:#94a3b8; line-height:1.5; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  .stat { padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); min-width:80px; }
  .stat .v { font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#7c8bb0; }
  .hint { margin-top:14px; font-size:11.5px; color:#64748b; line-height:1.6; }
  .hint b { color:#e2e8f0; }
  .kbd-hint { display:none; } @media (hover:hover) and (pointer:fine) and (min-width:900px){ .kbd-hint{display:block} }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:14px; }

  /* session missions (top-centre) */
  .missions { pointer-events:none; position:absolute; top:calc(env(safe-area-inset-top) + 96px); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:5px; align-items:center; width:min(58vw,290px); }
  .m-chip { width:100%; font-size:10.5px; padding:5px 10px; border-radius:10px; color:#cbd5e1; display:flex; justify-content:space-between; gap:8px; background:rgba(10,14,26,0.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); transition:all .25s; }
  .m-chip.done { color:#66ffcc; border-color:rgba(102,255,204,0.5); }
  .m-chip b { color:#fff; } .m-chip .mrew { color:#ffd76a; font-weight:800; }
  .combo { pointer-events:none; position:absolute; top:24%; left:50%; transform:translateX(-50%); text-align:center; opacity:0; transition:opacity .15s; }
  .combo.on { opacity:1; }
  .combo .cx { font-size:34px; font-weight:900; color:#ff2bd6; text-shadow:0 2px 16px rgba(255,43,214,0.6); font-variant-numeric:tabular-nums; }
  .combo .cl { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#ffd76a; font-weight:800; }

  /* progression / garage UI inside the card */
  .xpwrap { margin:12px 0 4px; }
  .xphead { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#94a3b8; }
  .xpbar { height:8px; border-radius:999px; background:rgba(255,255,255,0.1); overflow:hidden; margin-top:4px; }
  .xpfill { height:100%; background:linear-gradient(90deg,#4f6ef7,#8b5cf6,#ff2bd6); transition:width .5s ease; }
  .rankpill { display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.06em; }
  .streak { font-size:13px; color:#ffb454; font-weight:700; margin:6px 0 2px; }
  .mlist { text-align:left; margin:10px 0; display:flex; flex-direction:column; gap:6px; }
  .mrow { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:#cbd5e1; padding:7px 10px; border-radius:10px; background:rgba(255,255,255,0.03); }
  .mrow.done { color:#66ffcc; } .mrow .rw { color:#ffd76a; font-weight:700; }
  .earn { display:flex; justify-content:center; gap:14px; margin:8px 0; font-size:13px; }
  .earn b { font-variant-numeric:tabular-nums; }
  .crate { margin:10px auto; width:96px; height:96px; border-radius:18px; border:2px solid rgba(255,215,106,0.6); background:radial-gradient(circle at 50% 35%,rgba(255,200,80,0.28),rgba(20,14,4,0.85)); display:flex; align-items:center; justify-content:center; font-size:44px; cursor:pointer; animation:crateB 1s ease-in-out infinite; }
  @keyframes crateB { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-6px) rotate(3deg);} }
  .rowbtns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .garage-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
  .skin { border-radius:14px; padding:10px 6px 8px; border:2px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); cursor:pointer; position:relative; }
  .skin.sel { border-color:#00e5ff; box-shadow:0 0 18px rgba(0,229,255,0.3); }
  .skin.lock { opacity:.85; }
  .skin .sw { width:100%; height:30px; border-radius:8px; margin-bottom:6px; }
  .skin .nm { font-size:11px; font-weight:700; } .skin .pr { font-size:10px; color:#ffd76a; margin-top:2px; }
  .uprow { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; background:rgba(255,255,255,0.03); margin:7px 0; }
  .uprow .ic { font-size:20px; } .uprow .um { flex:1; text-align:left; }
  .uprow .un { font-size:12.5px; font-weight:700; } .uprow .ud { font-size:10px; color:#8892b0; }
  .pips { display:flex; gap:3px; margin-top:3px; } .pip { width:14px; height:5px; border-radius:2px; background:rgba(255,255,255,0.14); } .pip.on { background:linear-gradient(90deg,#00e5ff,#8b5cf6); }
  .ubtn { font-size:12px; font-weight:800; padding:8px 12px; border-radius:10px; border:1px solid rgba(0,229,255,0.5); background:rgba(0,229,255,0.1); color:#8affff; cursor:pointer; white-space:nowrap; }
  .ubtn:disabled { opacity:.4; cursor:default; }
  .ubtn.max { border-color:rgba(102,255,204,0.5); color:#66ffcc; background:rgba(102,255,204,0.08); }
  .tabs { display:flex; gap:8px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
  .tab { font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px; cursor:pointer; color:#94a3b8; background:rgba(255,255,255,0.04); }
  .tab.on { color:#fff; background:linear-gradient(135deg,#4f6ef7,#8b5cf6); }

  /* rotate-to-landscape prompt (this game is designed for landscape) */
  .rotate { position:absolute; inset:0; z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:32px; background:#05030f; }
  .rotate .ic { font-size:58px; animation:rotp 2.2s ease-in-out infinite; }
  @keyframes rotp { 0%,38%{transform:rotate(0)} 58%,100%{transform:rotate(90deg)} }
  .rotate h2 { margin:0; font-size:22px; font-weight:900; }
  .rotate p { margin:0; color:#94a3b8; font-size:14px; line-height:1.6; }
  .rotate { cursor:pointer; }
  .rotate .tap { margin-top:10px; font-size:13px; font-weight:800; color:#00e5ff; border:1px solid rgba(0,229,255,0.5); border-radius:999px; padding:9px 20px; }
  /* force-landscape: when the screen is portrait, rotate the whole game so it always renders in landscape */
  body.forcerot #app { position:fixed; top:0; left:0; width:100vh; height:100vw; transform-origin:top left; transform:rotate(90deg) translateY(-100vw); }

  /* landscape / short-height tuning */
  @media (orientation:landscape) and (max-height:560px) {
    .overlay { align-items:flex-start; padding:10px; }
    .card { max-height:96vh; overflow:auto; padding:16px 22px; max-width:520px; }
    .card h1 { font-size:24px; margin-bottom:2px; }
    .card p.lead { font-size:12.5px; margin-bottom:10px; }
    .row, .rowbtns { margin:6px 0; } .mlist { margin:6px 0; gap:4px; } .mrow { padding:5px 9px; }
    .xpwrap { margin:8px 0 2px; }
    .missions { top:calc(env(safe-area-inset-top) + 6px); width:min(42vw,300px); gap:4px; }
    .m-chip { font-size:10px; padding:4px 9px; }
    .minimap { width:94px; height:94px; bottom:calc(env(safe-area-inset-bottom) + 86px); }
    .gauge { min-width:104px; padding:6px 11px; } .gauge .v { font-size:22px; }
    .wheel { width:104px; height:104px; } .wheel .knob { width:46px; height:46px; }
    .act-btn { width:64px; height:64px; font-size:9px; } .act-btn .rk { font-size:19px; }
    .combo { top:20%; } .combo .cx { font-size:28px; }
  }
</style>
</head>

<div id="app">
  <div class="vignette"></div>
  <div class="speedblur" id="speedBlur"></div>
  <div class="boost-flash" id="boostFlash"></div>
  <div class="hurt-flash" id="hurtFlash"></div>

  <div class="hud">
    <div class="glass panel tl">
      <div class="label">Score</div><div><span class="score gradient-text" id="score">0</span></div>
      <div class="lap" style="color:#8fb0ff">LAP <span id="lap">1</span> · <span id="pos" style="color:#ffd76a">P1</span></div>
    </div>
    <div class="tr">
      <div class="glass panel" style="text-align:right"><div class="label">Best</div><div class="score" id="best" style="font-size:16px">0</div></div>
      <div class="glass chip" id="takedowns">💥 0</div>
      <div class="glass chip" style="color:#ffd76a" id="coinHud">💰 0</div>
      <div class="glass chip" style="color:#c4b5fd" id="lvHud">LV 1</div>
      <div class="glass chip" id="soundBtn">🔊</div>
    </div>
  </div>
  <div class="missions" id="missions"></div>
  <div class="combo" id="combo"></div>

  <div class="glass minimap" id="minimap"><canvas id="miniCv" width="116" height="116"></canvas></div>
  <div class="glass panel gauge">
    <div class="v" id="spVal">0</div><div class="u">km/h</div>
    <div class="bar"><div class="spfill" id="spFill"></div></div>
    <div class="nlabel">Nitro</div><div class="bar" id="nbar"><div class="nfill" id="nFill"></div></div>
  </div>

  <div class="popups" id="popups"></div>
  <div class="toasts" id="toasts"></div>

  <div class="wheel" id="wheel"><div class="knob" id="wheelKnob"></div><div class="wl">◀ steer ▶</div></div>
  <div class="actions">
    <button class="act-btn fire-btn" id="fireBtn"><span class="rk">🔫</span>FIRE</button>
    <button class="act-btn drift-btn" id="driftBtn"><span class="rk">🌀</span>DRIFT</button>
    <button class="act-btn nitro-btn" id="nitroBtn"><span class="rk">🔥</span>NITRO</button>
  </div>

  <div class="overlay" id="overlay"><div class="glass card" id="card"><div class="loading" style="position:static">Loading…</div></div></div>

  const clock=new THREE.Clock();

  let miniAcc=0;

  function animate(){

    fxFrame(dt);moonBody.rotation.y+=dt*0.01;planet.rotation.y+=dt*0.02;

    if(state.phase==="playing"){
      const s=state;
      if(s.hitStop>0){s.hitStop-=dt;renderScene();return;}   // brief freeze-frame on big takedowns
      // ---- throttle: always racing forward; nitro when held & available ----
      let boosting=(s.nitroOn||keys.has("arrowup")||keys.has("shift")||keys.has("w"))&&s.nitro>0.02;
      if(boosting){s.nitro=Math.max(0,s.nitro-dt*0.42);s.nitroTime+=dt;missionEvent("nitro",dt);}
      const target=boosting?NITRO_SPD:CRUISE;
      s.speed+=(target-s.speed)*Math.min(1,dt*(ACCEL/26));
      s.boostVis+=((boosting?1:0)-s.boostVis)*Math.min(1,dt*6);el.boostFlash.style.opacity=(s.boostVis*0.85).toFixed(2);

      // ---- steering = lane change across the road; drift charges nitro ----
      let steer=s.steer;if(keys.has("arrowleft")||keys.has("a"))steer-=1;if(keys.has("arrowright")||keys.has("d"))steer+=1;steer=Math.max(-1,Math.min(1,steer));
      const drifting=(s.drift||keys.has("arrowdown")||keys.has("s")||keys.has(" "))&&Math.abs(steer)>0.15&&s.air<=0;
      const laneSpd=drifting?TURN_LANE*1.5:TURN_LANE;
      s.lane+=steer*laneSpd*dt;
      const edge=ROAD_HW-1.4;
      if(s.lane>edge){s.lane=edge;if(s.air<=0){s.speed*=0.9;}}
      if(s.lane<-edge){s.lane=-edge;if(s.air<=0){s.speed*=0.9;}}
      // drift yaw (visual slide) + nitro charge + tyre smoke
      const yawTarget=drifting?-steer*0.5:( -steer*0.12 );
      s.driftYaw+=(yawTarget-s.driftYaw)*Math.min(1,dt*8);
      if(drifting){s.driftHold+=dt;s.driftTime+=dt;missionEvent("drift",dt);addNitro(dt*0.24*NITRO_MUL);if(Math.random()<0.6)puffSmoke(car.position.x-steer*0.6,0.3,car.position.z+1.6,0xbfc8dd);}
      else{if(s.driftHold>1.3){const b=Math.round(120*Math.min(3,s.driftHold));addScore(b);addNitro(0.16);popup("PERFECT DRIFT +"+b,0x8affff,car.position.x,2.4,car.position.z);meta.tot.pdrift++;missionEvent("pdrift",1);audio.power&&audio.power();}s.driftHold=0;}

      // ---- advance along the circuit ----

      const sl=segLen(Math.floor(s.t));s.t+=adv/Math.max(1,sl);
      if(s.t>=NODES){s.t-=NODES;s.lap++;
        if(s.mode!=="endless"&&s.lap>LAPS_TOTAL){endGame(true);}
        else{s.diff=1+(s.lap-1)*0.1;if(s.mode==="endless"){addScore(300);toast("LAP "+s.lap+" · +300","#ffd76a");el.lap.textContent=s.lap;}else{toast("LAP "+s.lap+"/"+LAPS_TOTAL,"#ffd76a");el.lap.textContent=s.lap;}}}

      // ---- ramps: launch into the air ----
      for(const ri of ramps){let d=Math.abs(((s.t-ri+NODES)%NODES));if(d>NODES/2)d=NODES-d;if(d<0.6&&s.air<=0&&Math.abs(s.lane)<ROAD_HW){s.air=1;s.vy=8+ s.speed*0.05;audio.power();toast("BIG AIR!","#00e5ff");meta.tot.air++;missionEvent("air",1);checkAch();}}
      if(s.air>0){s.carY+=s.vy*dt;s.vy-=22*dt;if(s.carY<=0){s.carY=0;s.vy=0;s.air=0;shakeAdd(0.25);puffSmoke(car.position.x,0.3,car.position.z,0xcccccc);}}

      // ---- nitro pads ----
      for(const p of nitroPads){let d=Math.abs(((s.t-p.idx+NODES)%NODES));if(d>NODES/2)d=NODES-d;if(d<0.7&&!p.used){p.used=1;addNitro(0.3*NITRO_MUL);audio.coin();setTimeout(()=>p.used=0,4000);}}
      // ---- coin pickups ----
      for(const p of coinPads){if(p.mesh.visible)p.mesh.rotation.z+=dt*3;let d=Math.abs(((s.t-p.idx+NODES)%NODES));if(d>NODES/2)d=NODES-d;if(d<0.7&&!p.used&&Math.abs(p.lane-s.lane)<3.4){p.used=1;p.mesh.visible=false;const c=Math.round((14+Math.floor(Math.random()*16))*COIN_MUL);addCoins(c);s.coinsRun+=c;popup("+"+c+"💰",0xffd76a,p.mesh.position.x,2,p.mesh.position.z);audio.coin&&audio.coin();setTimeout(()=>{if(state.phase==="playing"){p.used=0;p.mesh.visible=true;}},6000);}}
      // ---- combo chain decay ----
      if(s.chainT>0){s.chainT-=dt;if(s.chainT<=0)comboBreak();}
      // ---- guns ----
      s.fireTimer-=dt;if((s.firing||keys.has("f")||keys.has(" "))&&s.fireTimer<=0){s.fireTimer=FIRE_INT;fireGuns();}
      for(const b of bolts){if(!b.active)continue;b.t+=dt;b.mesh.position.x+=b.vx*dt;b.mesh.position.z+=b.vz*dt;if(b.t>1.4){b.active=false;b.mesh.visible=false;continue;}for(const r of rivals){if(!r.alive||r.launch)continue;if(Math.hypot(b.mesh.position.x-r.mesh.position.x,b.mesh.position.z-r.mesh.position.z)<2.2){b.active=false;b.mesh.visible=false;r.hp--;fireball(b.mesh.position.x,b.mesh.position.y,b.mesh.position.z,0.7);if(r.hp<=0){addScore(120);takedown(r,r.mesh.position.x,r.mesh.position.z);}break;}}}

      // ---- world transform: place car on the circuit ----
      const pn=trackAt(s.t);const hd=Math.atan2(-pn.tx,-pn.tz);
      const cx=pn.x+pn.nx*s.lane, cz=pn.z+pn.nz*s.lane;

      if(carParts.flames)for(const fl of carParts.flames){const sc=0.35+s.boostVis*2.0+Math.sin(time*44)*0.07;fl.scale.set(1+s.boostVis*0.3,sc,1+s.boostVis*0.3);}

      if(carParts.wheels){const wr=s.speed*dt*2.4;for(const w of carParts.wheels)w.rotation.x+=wr;}
      if(carParts.brake)carParts.brake.emissiveIntensity=drifting?3.2:0.6;

      // light trail
      if(carParts.skinA&&carParts.skinA[0])trailMat.color.copy(carParts.skinA[0].color);
      trailMat.opacity=0.35+s.boostVis*0.4;
      updateTrail(cx,cz,s.carY+bob);

      // ---- rivals ----
      const rubberBase=CRUISE*s.diff;
      for(const r of rivals){
        if(r.launch){const L=r.launch;L.t+=dt;r.mesh.position.x+=L.vx*dt;r.mesh.position.y+=L.vy*dt;r.mesh.position.z+=L.vz*dt;L.vy-=22*dt;r.mesh.rotation.x+=L.rx*dt;r.mesh.rotation.z+=L.rz*dt;if(Math.random()<0.35)fireball(r.mesh.position.x,r.mesh.position.y,r.mesh.position.z,1.1);if(L.t>1.1){r.mesh.visible=false;r.launch=null;}continue;}
        if(!r.alive){continue;}
        let dT0=((r.t-s.t+NODES)%NODES);if(dT0>NODES/2)dT0-=NODES;

        const rn=trackAt(r.t);r.mesh.position.set(rn.x+rn.nx*r.lane,rn.y+0.1,rn.z+rn.nz*r.lane);r.mesh.rotation.set(Math.atan(slopeAt(r.t))*0.9,Math.atan2(-rn.tx,-rn.tz),0);if(r.mesh.userData.flame)r.mesh.userData.flame.scale.set(1,1+Math.sin(time*30+r.ph)*0.3,1);
        let dT=((r.t-s.t+NODES)%NODES);if(dT>NODES/2){dT-=NODES;}
        const laneGap=Math.abs(r.lane-s.lane);
        if(Math.abs(dT)<0.9&&laneGap<3.0){

          if(!fast)hurt();                                    // ...but a slow clip damages you too
        } else if(Math.abs(dT)<0.7&&laneGap<4.6&&!r.nm){r.nm=true;addScore(90);addNitro(0.08);popup("CLOSE! +90",0xffe08a,r.mesh.position.x,2,r.mesh.position.z);meta.tot.near++;missionEvent("near",1);}
        if(Math.abs(dT)>3)r.nm=false;

      el.pos.textContent="P"+(1+ (rivals.filter(r=>r.alive).length - rivals.filter(r=>{let dT=((r.t-s.t+NODES)%NODES);return r.alive&&dT>0&&dT<NODES/2;}).length));

      // ---- HUD ----
      const spN=Math.min(1,s.speed/NITRO_SPD);const kmh=Math.round(s.speed*2.4);el.spVal.textContent=kmh;el.spFill.style.width=(spN*100)+"%";
      if(kmh>s.topSpeed){s.topSpeed=kmh;missionEvent("top",kmh);}missionEvent("score",s.score);
      el.nFill.style.width=(s.nitro*100)+"%";el.nbar.classList.toggle("nfull",s.nitro>=0.999);
      audio.setEngineIntensity(spN);
      if(s.invuln>0)s.invuln-=dt;if(s.hurtT>0){s.hurtT-=dt;el.hurtFlash.style.opacity=s.hurtT.toFixed(2);}else el.hurtFlash.style.opacity="0";

      // ---- speed lines + blur ----
      speedLineFrame(dt);slTimer-=dt;if(slTimer<=0){slTimer=Math.max(0.024,0.05-spN*0.03);emitSpeedLines(spN,boosting,pn.tx,pn.tz);}
      const blurN=Math.max(0,(spN-0.4)/0.6);el.speedBlur.style.opacity=(blurN*(boosting?1:0.8)).toFixed(2);

      // ---- chase camera ----
      s.shake*=Math.pow(0.0009,dt);if(s.shake<0.01)s.shake=0;const vib=(spN*0.06+s.boostVis*0.08);const sh=s.shake+vib;
      const behind=trackAt(s.t-CAM_DIST/NODE_SP);const aheadP=trackAt(s.t+LOOK_AHEAD/NODE_SP);
      const camDist=CAM_DIST+s.boostVis*2.6, camH=pn.y+CAM_H+s.carY*0.5-slope*4;
      const desiredX=behind.x+behind.nx*s.lane*0.6, desiredZ=behind.z+behind.nz*s.lane*0.6;
      const lp=Math.min(1,dt*5);
      camera.position.x+=(desiredX-camera.position.x)*lp+(Math.random()-0.5)*sh*0.5;
      camera.position.z+=(desiredZ-camera.position.z)*lp+(Math.random()-0.5)*sh*0.5;
      camera.position.y+=((camH)-camera.position.y)*lp+(Math.random()-0.5)*sh*0.35;
      s.camLean=(s.camLean||0)+((-steer*0.05)-(s.camLean||0))*Math.min(1,dt*6);   // subtle lean into corners
      camera.up.set(Math.sin(s.camLean),Math.cos(s.camLean),0);
      camera.lookAt(aheadP.x,aheadP.y+1.6+s.carY*0.6,aheadP.z);
      camFov+=((72+s.boostVis*22+spN*14)-camFov)*Math.min(1,dt*4);camera.fov=camFov;camera.updateProjectionMatrix();

      miniAcc+=dt;if(miniAcc>0.08){miniAcc=0;drawMinimap();}
    } else {
      if(el.speedBlur.style.opacity!=="0")el.speedBlur.style.opacity="0";
      if(trailMesh.visible)trailMesh.visible=false;
      // idle: fly the camera along the circuit as a preview
      const tt=(time*6)%NODES;const pn=trackAt(tt);const nn=trackAt(tt+2);
      camera.up.set(0,1,0);camera.position.set(pn.x-pn.tx*13,7,pn.z-pn.tz*13);camera.lookAt(nn.x,2,nn.z);camera.fov=70;camera.updateProjectionMatrix();
      car.position.set(pn.x,0,pn.z);car.rotation.y=Math.atan2(-pn.tx,-pn.tz);
    }
    renderScene();
  }
  renderOverlay();onResize();animate();
})();
</script>
